services:
  mobile-security-postgres:
    image: "postgres:latest"
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    volumes:
      - $HOME/Vrika/postgresql_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=prowler_admin
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=vrika_mobile_security
    networks:
      - vrika_network



  djangoq:
    image: opensecurity/mobile-security-framework-vrika:latest
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: /home/vrika_mobile_security/vrika-mobile-security/scripts/qcluster.sh
    volumes:
      - $HOME/Vrika/vrika_data:/home/vrika_mobile_security/.Vrika
    environment:
      - POSTGRES_USER=prowler_admin
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=vrika_mobile_security
      - POSTGRES_HOST=mobile-security-postgres
      - POSTGRES_PORT=5432
    networks:
      - vrika_network

  vrika_mobile_security:
    image: opensecurity/mobile-security-framework-vrika:latest
    build:
      context: ..
      dockerfile: Dockerfile
    restart: always
    tty: true
    volumes:
      - $HOME/Vrika/vrika_data:/home/vrika_mobile_security/.Vrika
    environment:
      - POSTGRES_USER=prowler_admin
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=vrika_mobile_security
      - POSTGRES_HOST=mobile-security-postgres
      - POSTGRES_PORT=5432
      - VRIKA_ASYNC_ANALYSIS=1
      - VRIKA_SCRIPT_NAME=/mobsf/
      # Shared with vrika-server MOBILE_SECURITY_API_KEY; empty falls back to the generated key.
      - VRIKA_API_KEY=${VRIKA_API_KEY:-}
      # ADB serial of the redroid emulator on vrika_network (container name:5555).
      - VRIKA_ANALYZER_IDENTIFIER=${VRIKA_ANALYZER_IDENTIFIER:-redroid11:5555}
      - VRIKA_BRIDGE_SECRET=super_secret_vrika_key_6b6f64508eed98bbc9a76fc6e59daa1bf8
      # Opt in only for a firewall-restricted host ADB server.
      # Device discovery and Frida forwards then use host.docker.internal:
      # - ADB_SERVER_SOCKET=tcp:host.docker.internal:5037
    ports:
      - "127.0.0.1:8001:8000"

    healthcheck:
      test: curl -f http://localhost:8000/login/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      - djangoq
    networks:
      vrika_network:
        # Hostname without underscores so Django accepts the Host header from vrika-server.
        aliases:
          - mobile-security-engine
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  vrika_network:
    driver: bridge
